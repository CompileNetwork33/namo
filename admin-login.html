<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Namo Medical Store</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <!-- FontAwesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>
<body class="admin-login-body">

  <div class="admin-login-container">
    <div class="admin-login-card">
      <div class="admin-brand">
        <div class="logo-icon"><i class="fas fa-user-shield"></i></div>
        <h1>Namo Medical Admin</h1>
        <p>Sign in to access management dashboard</p>
      </div>

      <!-- Alert Box for Error Messages -->
      <div id="login-error" class="admin-alert admin-alert-error" style="display: none;" role="alert">
        <i class="fas fa-exclamation-circle"></i>
        <span id="login-error-text">Invalid credentials. Please try again.</span>
      </div>

      <form id="admin-login-form" novalidate>
        <div class="admin-form-group">
          <label for="admin-email">Email Address</label>
          <div class="admin-input-wrap">
            <i class="fas fa-envelope"></i>
            <input
              type="email"
              id="admin-email"
              name="email"
              placeholder="admin@namomedical.com"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <div class="admin-form-group">
          <label for="admin-password">Password</label>
          <div class="admin-input-wrap">
            <i class="fas fa-lock"></i>
            <input
              type="password"
              id="admin-password"
              name="password"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="admin-btn admin-btn-primary admin-btn-full">
          <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Login</span>
          <span class="btn-spinner" style="display: none;"><i class="fas fa-circle-notch fa-spin"></i> Logging in…</span>
        </button>
      </form>

      <div class="admin-login-footer">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Return to Main Website</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/admin-login.js"></script>
</body>
</html>
